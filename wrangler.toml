#:schema node_modules/wrangler/config-schema.json
name = "translatemessages"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Browser origins allowed to read responses from this Worker, comma-separated.
# Any http://localhost:<port> origin is always allowed so local.html and
# `npm run dev` work without configuration. CORS is enforced by browsers only,
# so this has no effect on cli/translate_messages.rb or curl.
[vars]
ALLOWED_ORIGINS = "https://translatemessages.pages.dev"
# ALLOWED_MODELS is deliberately unset here, which limits this public endpoint to
# DEFAULT_MODEL alone. Nothing rate-limits it, and llama-3.3-70b costs roughly 5.7x
# the default per token, so clients must not be able to pick the model.
DEFAULT_MODEL = "llama-3.1-8b"
# Entries -- not requests -- this deployment will send to the model per UTC day.
# Requests are refused with a 503 once it is used up, until the window rolls over.
# 20,000 is roughly 53 files the size of the 373-entry sample in
# docs/model-comparison/, which at about $0.0044 each caps a runaway day near $0.23.
# That deliberately exceeds the ~10,000 Neuron free allocation: the free tier is
# about 25 files, which is too mean for a public demo, and the overage is small
# enough to absorb. The unit is entries because that is what the cost scales with --
# counting requests would let one 3,000-entry upload spend the day and report one.
DAILY_ENTRY_BUDGET = "20000"

# Backs DAILY_ENTRY_BUDGET. A Durable Object rather than KV so concurrent increments
# serialise instead of overwriting each other, which is the whole point: a counter
# that undercounts under load fails exactly when the cap matters.
[[durable_objects.bindings]]
name = "DAILY_SPEND"
class_name = "DailySpendCounter"

# SQLite-backed because that is the only option for new classes on the free plan.
# Environments do not inherit migrations, so staging repeats this block.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailySpendCounter"]

# Per-IP burst protection for the public endpoint. Burst only: the binding's window
# maxes out at 60 seconds and its counters are per Cloudflare location, so this stops
# a script hammering the endpoint but does not cap a day's spend. 20/minute leaves
# room for the CLI translating into a dozen languages back to back.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# The production custom domain (translatemessages.justblackmagic.com) is currently
# configured in the Cloudflare dashboard rather than here, so it cannot be
# reproduced from this repo alone. To make it declarative, uncomment:
# [[routes]]
# pattern = "translatemessages.justblackmagic.com"
# custom_domain = true

# Automatically place your workloads in an optimal location to minimize latency.
# If you are running back-end logic in a Worker, running it closer to your back-end infrastructure
# rather than the end user may result in better performance.
# Docs: https://developers.cloudflare.com/workers/configuration/smart-placement/#smart-placement
# [placement]
# mode = "smart"

# Variable bindings. These are arbitrary, plaintext strings (similar to environment variables)
# Docs:
# - https://developers.cloudflare.com/workers/wrangler/configuration/#environment-variables
# Note: Use secrets to store sensitive data.
# - https://developers.cloudflare.com/workers/configuration/secrets/
# [vars]
# MY_VARIABLE = "production_value"

# Bind the Workers AI model catalog. Run machine learning models, powered by serverless GPUs, on Cloudflare’s global network
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#workers-ai
[ai]
binding = "AI"

# Bind an Analytics Engine dataset. Use Analytics Engine to write analytics within your Pages Function.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#analytics-engine-datasets
# [[analytics_engine_datasets]]
# binding = "MY_DATASET"

# Bind a headless browser instance running on Cloudflare's global network.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#browser-rendering
# [browser]
# binding = "MY_BROWSER"

# Bind a D1 database. D1 is Cloudflare’s native serverless SQL database.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#d1-databases
# [[d1_databases]]
# binding = "MY_DB"
# database_name = "my-database"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Bind a dispatch namespace. Use Workers for Platforms to deploy serverless functions programmatically on behalf of your customers.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#dispatch-namespace-bindings-workers-for-platforms
# [[dispatch_namespaces]]
# binding = "MY_DISPATCHER"
# namespace = "my-namespace"

# Bind a Durable Object. Durable objects are a scale-to-zero compute primitive based on the actor model.
# Durable Objects can live for as long as needed. Use these when you need a long-running "server", such as in realtime apps.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#durable-objects
# [[durable_objects.bindings]]
# name = "MY_DURABLE_OBJECT"
# class_name = "MyDurableObject"

# Durable Object migrations.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#migrations
# [[migrations]]
# tag = "v1"
# new_classes = ["MyDurableObject"]

# Bind a Hyperdrive configuration. Use to accelerate access to your existing databases from Cloudflare Workers.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#hyperdrive
# [[hyperdrive]]
# binding = "MY_HYPERDRIVE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Bind a KV Namespace. Use KV as persistent storage for small key-value pairs.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#kv-namespaces
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Bind an mTLS certificate. Use to present a client certificate when communicating with another service.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#mtls-certificates
# [[mtls_certificates]]
# binding = "MY_CERTIFICATE"
# certificate_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Bind a Queue producer. Use this binding to schedule an arbitrary task that may be processed later by a Queue consumer.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#queues
# [[queues.producers]]
# binding = "MY_QUEUE"
# queue = "my-queue"

# Bind a Queue consumer. Queue Consumers can retrieve tasks scheduled by Producers to act on them.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#queues
# [[queues.consumers]]
# queue = "my-queue"

# Bind an R2 Bucket. Use R2 to store arbitrarily large blobs of data, such as files.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#r2-buckets
# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# Bind another Worker service. Use this binding to call another Worker without network overhead.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#service-bindings
# [[services]]
# binding = "MY_SERVICE"
# service = "my-service"

# Bind a Vectorize index. Use to store and query vector embeddings for semantic search, classification and other vector search use-cases.
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/#vectorize-indexes
# [[vectorize]]
# binding = "MY_INDEX"
# index_name = "my-index"

# Staging environment configuration
# Deploy with: wrangler deploy --env staging
[env.staging]
name = "translatemessages-staging"

[env.staging.ai]
binding = "AI"

[env.staging.observability]
enabled = true

# Named environments do not inherit top-level [vars], so these must be repeated.
# Staging offers the whole registry because scripts/compare-models.mjs drives it.
[env.staging.vars]
ALLOWED_ORIGINS = "https://translatemessages.pages.dev"
DEFAULT_MODEL = "llama-3.1-8b"
ALLOWED_MODELS = "m2m100,llama-3.1-8b,llama-3.2-3b,llama-3.3-70b,llama-4-scout,gemma-3-12b,mistral-small-3.1"
# Smaller than production because staging only has to survive scripts/compare-models.mjs,
# which spends about 320 entries per run against the 40-entry fixture. 5,000 leaves room
# for a dozen runs a day while still being a ceiling the harness can actually hit --
# a cap that is never reached is a cap that is never tested.
DAILY_ENTRY_BUDGET = "5000"

# Its own counter, on its own object: sharing production's would let the harness
# spend the public deployment's budget.
[[env.staging.durable_objects.bindings]]
name = "DAILY_SPEND"
class_name = "DailySpendCounter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["DailySpendCounter"]

# A separate namespace from production, so the comparison harness hitting staging
# hard cannot consume production's budget for the same IP.
[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

  [env.staging.ratelimits.simple]
  limit = 60
  period = 60

# Personal instance. Defaults to llama-4-scout, which measured best on wording
# quality and is roughly 3x faster than the default, at about 3.3x the token cost --
# a fine trade on a private endpoint with one user, and a poor one on a public
# endpoint with no rate limiting. Deploy with: wrangler deploy --env personal
[env.personal]
name = "translatemessages-personal"

[env.personal.ai]
binding = "AI"

[env.personal.observability]
enabled = true

[env.personal.vars]
DEFAULT_MODEL = "llama-4-scout"
ALLOWED_MODELS = "m2m100,llama-3.1-8b,llama-3.2-3b,llama-3.3-70b,llama-4-scout,mistral-small-3.1"
# No browser origin is allowed: this instance is for the CLI, which sends no Origin
# header and is unaffected by CORS. Add one here if you ever point a page at it.
ALLOWED_ORIGINS = ""
# Deliberately no [[ratelimits]] binding: one known user, and the code treats a
# missing binding as "do not limit". Add one if this URL ever gets shared.
# Same reasoning for the daily spend cap: no DAILY_SPEND binding and no
# DAILY_ENTRY_BUDGET, which the code treats as "do not cap". The spend here is one
# person's own, and a cap that locked them out until midnight would be all cost and
# no benefit. Add both if this URL ever gets shared.
