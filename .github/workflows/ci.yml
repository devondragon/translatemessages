name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run test type check
        run: npx tsc -p test/tsconfig.json --noEmit

      - name: Run tests
        run: npm test

      # Builds the Worker and resolves the staging config without authenticating
      # or uploading, so it runs on fork PRs with no secrets. Catches config,
      # bundle and toolchain breakage on the PR instead of after merge, since
      # deploy-staging below is push-only and never runs on a PR.
      - name: Validate staging deploy config
        run: npx wrangler deploy --env staging --dry-run

  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    permissions:
      contents: read
    # Queue deploys rather than running them concurrently, so rapid merges to
    # main can't race and leave staging on the older of the two commits.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Failures on main are otherwise invisible: PR checks stay green because
  # deploy-staging is push-only, so a broken deploy is only ever discovered by
  # someone happening to look at the Actions tab. File an issue instead, and
  # comment on the existing one rather than opening a new issue per failure.
  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, deploy-staging]
    if: ${{ failure() && github.event_name == 'push' }}
    permissions:
      issues: write

    steps:
      - name: Open or update the CI failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'CI failed on `main`.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'ci-failure',
            });

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'CI failure on main',
                body,
                labels: ['ci-failure'],
              });
            }
